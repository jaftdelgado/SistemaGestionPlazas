# Entorno local de SGPLa: SQL Server + migraciones (DbUp) + API REST.
#   docker compose up -d --build
# Las variables se leen de .env (ver .env.example); todas tienen un valor por defecto para desarrollo.
name: sgpla

x-cadena-conexion: &cadena-conexion "Server=sqlserver,1433;Database=sgpla-bd;User Id=sa;Password=${SGPLA_SA_PASSWORD:-Sgpla_Dev_2026!};TrustServerCertificate=True;Encrypt=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SGPLA_SA_PASSWORD:-Sgpla_Dev_2026!}"
    ports:
      - "${SGPLA_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Aplica los scripts de sgpla-backend/src/Sgpla.Database/Scripts y termina.
  migraciones:
    build:
      context: ./sgpla-backend
      dockerfile: src/Sgpla.Database/Dockerfile
    command: ["--ensure-database"]
    environment:
      SGPLA_DB_CONNECTION: *cadena-conexion
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./sgpla-backend
      dockerfile: src/Sgpla.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${SGPLA_API_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Sgpla: *cadena-conexion
      Cors__OrigenesPermitidos__0: "${SGPLA_WEB_ORIGIN:-http://localhost:5173}"
      Jwt__Clave: "${SGPLA_JWT_CLAVE:?la variable SGPLA_JWT_CLAVE es obligatoria}"
      Ldap__Servidor: "${SGPLA_LDAP_SERVIDOR:-148.226.12.10}"
      Ldap__Puerto: "${SGPLA_LDAP_PUERTO:-389}"
      Ldap__Seguridad: "${SGPLA_LDAP_SEGURIDAD:-SinTls}"
      SGPLA_BOOTSTRAP_CORREO: "${SGPLA_BOOTSTRAP_CORREO:-}"
      SGPLA_BOOTSTRAP_NOMBRE: "${SGPLA_BOOTSTRAP_NOMBRE:-}"
    ports:
      - "${SGPLA_API_PORT:-8180}:8080"
    depends_on:
      migraciones:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
