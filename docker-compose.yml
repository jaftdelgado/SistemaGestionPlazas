# Entorno local de SGPLa: PostgreSQL + migraciones (DbUp) + API REST + frontend (Vite).
#   docker compose up -d --build
# Las variables se leen de .env (ver .env.example); todas tienen un valor por defecto para desarrollo.
name: sgpla

x-cadena-conexion: &cadena-conexion "Host=postgres;Port=5432;Database=sgpla-bd;Username=sgpla;Password=${SGPLA_DB_PASSWORD:-Sgpla_Dev_2026!}"

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: "sgpla-bd"
      POSTGRES_USER: "sgpla"
      POSTGRES_PASSWORD: "${SGPLA_DB_PASSWORD:-Sgpla_Dev_2026!}"
    ports:
      - "${SGPLA_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgpla -d sgpla-bd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Aplica los scripts de sgpla-backend/src/Sgpla.Database/Scripts y termina.
  migraciones:
    build:
      context: ./sgpla-backend
      dockerfile: src/Sgpla.Database/Dockerfile
    command: ["--ensure-database"]
    environment:
      SGPLA_DB_CONNECTION: *cadena-conexion
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./sgpla-backend
      dockerfile: src/Sgpla.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${SGPLA_API_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Sgpla: *cadena-conexion
      Cors__OrigenesPermitidos__0: "${SGPLA_WEB_ORIGIN:-http://localhost:5173}"
      Jwt__Clave: "${SGPLA_JWT_CLAVE:?la variable SGPLA_JWT_CLAVE es obligatoria}"
      Ldap__Servidor: "${SGPLA_LDAP_SERVIDOR:-148.226.12.10}"
      Ldap__Puerto: "${SGPLA_LDAP_PUERTO:-389}"
      Ldap__Seguridad: "${SGPLA_LDAP_SEGURIDAD:-SinTls}"
      SGPLA_BOOTSTRAP_CORREO: "${SGPLA_BOOTSTRAP_CORREO:-}"
      SGPLA_BOOTSTRAP_NOMBRE: "${SGPLA_BOOTSTRAP_NOMBRE:-}"
      SolicitudesApertura__PeriodoActual: "${SGPLA_PERIODO_ACTUAL:-202601}"
      SolicitudesApertura__PeriodoSiguiente: "${SGPLA_PERIODO_SIGUIENTE:-202651}"
      Almacenamiento__RutaBase: "/var/lib/sgpla/archivos"
    ports:
      - "${SGPLA_API_PORT:-8180}:8080"
    volumes:
      - archivos-data:/var/lib/sgpla/archivos
    depends_on:
      migraciones:
        condition: service_completed_successfully

  # Servidor de desarrollo de Vite con recarga en caliente. node_modules queda en sgpla-web/ del host.
  web:
    image: node:24.21.0-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev"]
    environment:
      pnpm_config_store_dir: /pnpm/store
      VITE_API_URL: "http://localhost:${SGPLA_API_PORT:-8180}"
      SGPLA_WEB_POLLING: "${SGPLA_WEB_POLLING:-true}"
      SGPLA_OPENAPI_URL: "http://api:8080/openapi/v1.json"
    ports:
      - "${SGPLA_WEB_PORT:-5173}:5173"
    volumes:
      - ./sgpla-web:/app
      - pnpm-store:/pnpm/store
      - web-node-modules:/app/node_modules

volumes:
  postgres-data:
  archivos-data:
  pnpm-store:
  web-node-modules:
